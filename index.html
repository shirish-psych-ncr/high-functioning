<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Allow pinch-zoom for accessibility (WCAG 1.4.4); keep notch-safe viewport-fit -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A Romanized-Hindi presentation on identifying and treating mental health disorders in underprivileged and rural Indian children, based on the Mind Grace Neuropsychiatric Clinic framework.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Mansik Swasthya: Gaon aur Garib Ilaqon ke Bacche (Mind Grace)</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-accent: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --soundbite-bg: rgba(56, 189, 248, 0.08);
            --soundbite-border: #38bdf8;
            --translation-bg: rgba(148, 163, 184, 0.08);
            --translation-border: #94a3b8;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --controls-h: 4.5rem; /* reserve space for the fixed control bar */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Text inside slides stays selectable so users can copy it */
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation; /* suppresses double-tap zoom delay on controls */
        }

        .slide-content, .slide-content * {
            -webkit-user-select: text;
            user-select: text;
        }

        /* Navigation zones: mouse click targets, layered below slides.
           Touch is handled by the unified pointer controller instead. */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 0;           /* below slides: text stays selectable/scrollable */
            cursor: pointer;      /* desktop-only convenience click targets */
            pointer-events: none; /* enabled for mouse users only, via JS */
        }
        .nav-zone.left { left: 0; }
        .nav-zone.right { right: 0; }
        body.has-mouse .nav-zone { pointer-events: auto; }

        /* Slide Container */
        .presentation-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100dvh;
            padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 4rem)
                     calc(var(--controls-h) + 1.5rem + var(--safe-bottom))
                     clamp(1rem, 4vw, 4rem);
            display: flex;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transform: translateX(20px);
            /* Animate only compositor-friendly properties */
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            z-index: 1;
            will-change: opacity, transform;
        }

        .slide.active {
            visibility: visible;
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s;
            z-index: 5;
        }

        .slide-content {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Typography — fluid sizes with clamp() for all screen widths */
        h1 {
            font-size: clamp(1.3rem, 0.9rem + 2vw, 1.95rem);
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--bg-accent);
            padding-bottom: 0.6rem;
            letter-spacing: -0.5px;
            line-height: 1.2;
            overflow-wrap: anywhere; /* prevent long words from causing horizontal scroll */
        }

        h2 {
            font-size: clamp(0.85rem, 0.75rem + 0.55vw, 1.02rem);
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 0.95rem;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: clamp(0.95rem, 0.85rem + 0.5vw, 1.12rem);
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 0.9rem;
            line-height: 1.5;
        }

        /* Layout optimization: "The Clinical Reality" lists sit inside a
           card; top-level items are compact stacked blocks with tighter
           spacing so dense slides (e.g. Slide 4) stay readable on mobile. */
        .reality-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-accent);
            border-radius: 10px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 0.5rem;
        }

        ul, ol {
            list-style-type: none;
            padding-left: 1.2rem;
        }

        li {
            margin-bottom: 0.4rem;
            line-height: 1.6;
            color: var(--text-secondary);
            position: relative;
            font-size: clamp(0.85rem, 0.78rem + 0.32vw, 1rem);
            overflow-wrap: anywhere;
        }

        li::before {
            content: "•";
            color: var(--accent-color);
            position: absolute;
            left: -1rem;
            font-weight: bold;
        }

        /* Numbered steps (ordered lists) show their own counters */
        ol { counter-reset: step; }
        ol > li { counter-increment: step; }
        ol > li::before {
            content: counter(step);
            color: var(--accent-color);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        ol ol { counter-reset: substep; }
        ol ol > li { counter-increment: substep; }
        ol ol > li::before { content: counter(step) "." counter(substep); }

        ul ul { padding-left: 1rem; margin-top: 0.2rem; }
        ul ul li { margin-bottom: 0.25rem; line-height: 1.5; }
        ul ul li::before { content: "-"; color: var(--text-muted); }
        ul ul ul { padding-left: 1rem; }
        ul ul ul li::before { content: "◦"; color: var(--text-muted); font-size: 0.8rem; }
        ol > li > ul { padding-left: 1rem; }
        ol > li > ul li::before { content: "-"; color: var(--text-muted); }

        /* Top-level clinical points as compact stacked blocks */
        ul > li, ol > li { padding-left: 0.2rem; }
        ul > li:first-child > strong,
        ul > li:first-child > b,
        ol > li:first-child > strong { margin-top: 0; }
        ul > li > strong, ul > li > b,
        ol > li > strong {
            display: block;
            margin-top: 0.55rem;
            line-height: 1.4;
        }

        em {
            font-style: italic;
            color: var(--text-muted);
        }

        strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Special Sections */
        .translation-box {
            background: var(--translation-bg);
            border-left: 4px solid var(--translation-border);
            padding: 0.8rem 1.1rem;
            margin: 0.9rem 0 0.4rem;
            border-radius: 0 8px 8px 0;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            color: var(--text-primary);
            font-style: italic;
            line-height: 1.6;
        }

        .soundbite-box {
            background: var(--soundbite-bg);
            border: 1px solid var(--soundbite-border);
            padding: 0.9rem 1.1rem;
            margin-top: 0.9rem;
            border-radius: 8px;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            box-shadow: 0 0 20px var(--accent-glow);
            line-height: 1.5;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: calc(10px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.8rem;
            z-index: 20;
            background: rgba(15, 23, 42, 0.9);
            padding: 0.6rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--bg-accent);
            max-width: min(92vw, 480px);
        }

        button {
            background: var(--bg-accent);
            color: var(--text-primary);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            min-width: 44px;   /* touch-target minimum (WCAG 2.5.5) */
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        button:hover:not(:disabled),
        button:focus-visible:not(:disabled) {
            background: var(--accent-color);
            color: var(--bg-primary);
        }

        button:active:not(:disabled) {
            background: var(--accent-color);
            color: var(--bg-primary);
            transform: scale(0.97);
        }

        button:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: var(--bg-accent);
            color: var(--text-muted);
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--bg-accent);
            z-index: 20;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            /* GPU-accelerated width animation instead of layout-thrashing width% */
            width: 100%;
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .slide-counter {
            position: fixed;
            top: calc(15px + var(--safe-top));
            right: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            z-index: 20;
            font-weight: 600;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            font-variant-numeric: tabular-nums; /* prevents counter jitter */
        }

        /* Scrollbar styling */
        .slide::-webkit-scrollbar { width: 4px; }
        .slide::-webkit-scrollbar-track { background: transparent; }
        .slide::-webkit-scrollbar-thumb { background: var(--bg-accent); border-radius: 2px; }

        /* Large screens / desktop */
        @media (min-width: 1025px) {
            .slide { padding-top: clamp(1.5rem, 3vh, 2.5rem); }
            .nav-zone:hover { background: linear-gradient(to right, rgba(56,189,248,0.04), transparent); }
            .nav-zone.right:hover { background: linear-gradient(to left, rgba(56,189,248,0.04), transparent); }
        }

        /* Tablet specific adjustments */
        @media (min-width: 768px) and (max-width: 1024px) {
            .slide { padding: 1.5rem 2.5rem calc(var(--controls-h) + 1rem + var(--safe-bottom)) 2.5rem; }
        }

        /* Mobile specific adjustments */
        @media (max-width: 767px) {
            .controls {
                width: min(92%, 420px);
                justify-content: space-between;
                padding: 0.5rem;
            }
            button {
                flex: 1;
                font-size: 0.9rem;
                padding: 0.8rem;
            }
            .slide-counter { right: 12px; }
        }

        /* Very small phones (<= 360px) */
        @media (max-width: 360px) {
            :root { --controls-h: 4rem; }
            h1 { font-size: 1.25rem; }
            ul { padding-left: 1rem; }
        }

        /* Short/wide viewports (landscape phones): keep content usable without scroll traps */
        @media (max-height: 500px) and (orientation: landscape) {
            .slide { padding-bottom: calc(var(--controls-h) + 0.5rem + var(--safe-bottom)); }
            h1 { margin-bottom: 0.8rem; padding-bottom: 0.4rem; }
            h2 { margin-top: 0.8rem; margin-bottom: 0.3rem; }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .slide,
            .progress-bar,
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div class="slide-counter" id="slideCounter" aria-live="polite">1 / 12</div>

    <main class="presentation-container" id="presentation" aria-label="Presentation slides">
        <!-- Slides injected by JS -->
    </main>

    <!-- Transparent click zones for desktop navigation -->
    <div class="nav-zone left" id="navLeft" aria-hidden="true"></div>
    <div class="nav-zone right" id="navRight" aria-hidden="true"></div>

    <nav class="controls" aria-label="Slide navigation">
        <button id="btnPrev" type="button" aria-label="Previous slide">← Prev</button>
        <button id="btnNext" type="button" aria-label="Next slide">Next →</button>
    </nav>

    <div class="progress-container" role="progressbar" aria-label="Presentation progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <script>
        const slidesData = [
            {
                title: "Slide 1: The Core Paradox (Asliyat aur Dikhawa)",
                question: "Jab baccha bahar se theek dikhta hai, toh uska mansik dard (mental distress) aksar chhup kyun jata hai?",
                reality: `<ul><li><strong>High Prevalence</strong> (bhaari sankhya)<ul><li>Bharat mein school jaane wale bacchon mein lagbhag <strong>24% depression</strong> (udasi), <strong>45% anxiety</strong> (ghabrahat), aur <strong>30% stress</strong> (tanaav) se jujh rahe hain</li></ul></li><li><strong>The Treatment Gap</strong> (ilaaj ki kami)<ul><li>Bharat mein <strong>15 crore (150 million)</strong> logon ko mansik swasthya sahara chahiye</li><li>lekin <strong>7 mein se sirf 1</strong> ko hi yeh sahara mil pata hai</li></ul></li></ul>`,
                translation: "\"Jab baccha bahar se theek dikhta hai ya chup rehta hai, toh hum bhool jaate hain ki uska dimaag andar se thak chuka hai.\"",
                soundbite: "\"Bacche ki chuppi ya achanak aaya gussa aksar uski madad ki pukar hoti hai, na ki sirf badtameezi.\""
            },
            {
                title: "Slide 2: The Hidden Tax (Rozmara ki Thakan ka Asar)",
                question: "Roz ki thakan aur tanaav (stress) bacche ke dimaag par kya asar dalta hai?",
                reality: `<ul><li><strong>Attention Residue</strong> (ek kaam chhod kar dusre kaam mein pura dhyaan na lag paana)<ul><li>Ghar ki chinta ya dar ke karan, baccha school ya khel mein poora dhyaan nahi laga paata</li></ul></li><li><strong>Recovery Affected</strong> (aaram na mil paana)<ul><li>Raat ko neend na aana ya hamesha alert (satark) rehna</li><li>bacche ke dimaag ko agle din ke liye taiyaar hone se rokta hai</li></ul></li></ul>`,
                translation: "\"Baccha shayad school ja raha hai, lekin uska dimaag ghar ki pareshaniyon mein atka hua hai, jisse uski energy jaldi khatam ho jaati hai.\"",
                soundbite: "\"Is thakan ka hisaab ghante mein nahi, bacche ki khoi hui muskaan aur dhyaan (focus) mein chukana padta hai.\""
            },
            {
                title: "Slide 3: Rationalization vs. Noticing (Bahana Banana vs. Samajhna)",
                question: "Hum bacchon ki pareshaniyon ko \"bas ek phase hai\" keh kar kyun taal dete hain?",
                reality: `<ul><li><strong>Stigma</strong> (samajik dar ya sharm)<ul><li>Logon ko dar lagta hai ki agar humne maan liya ki baccha pareshan hai, toh samaj use \"pagal\" (mentally ill) kahega</li></ul></li><li><strong>Functional Denial</strong> (sach ko na sweekar karna)<ul><li>Hum bacche ke dard ko \"woh bas drama kar raha hai\" keh kar taal dete hain</li><li>kyunki sach ko sweekar karna mushkil hota hai</li></ul></li></ul>`,
                translation: "\"Jab hum bacche ki pareshani ko 'aalas' ya 'bahana' ka naam de dete hain, toh hum uski madad karne ka sabse bada mauka gawa dete hain.\"",
                soundbite: "\"Badlav ko pehchano (Notice) aur ek kadam aage badho (Act): kisi bharosemand vyakti se baat karo ya madad lo.\""
            },
            {
                title: "Slide 4: How to Tell: Symptoms in Rural Children (Lakshan Kaise Pehchanein)",
                question: "Gaon ya garib ilaqon mein bacchon mein depression, anxiety aur anya bimariyon ko kaise pehchanein?",
                reality: `<ul><li><strong>Depression (Avsaad)</strong><ul><li>Baccha school ya ghar ka kaam toh kar raha hai, lekin uski khushi, energy aur doston se judav (connection) lagatar kam ho raha hai</li></ul></li><li><strong>Anxiety (Ghabrahat)</strong><ul><li>Baar-baar ek hi baat poochna, bina kisi medical wajah ke pet dard (<em>stomach ache</em>) ya sir dard (<em>headache</em>), aur hamesha darra hua rehna</li></ul></li><li><strong>OCD</strong><ul><li>Aise vichaar jo dimaag mein baar-baar aayein (intrusive doubts)</li><li>baccha unhe kam karne ke liye baar-baar kuch check kare ya koi ritual kare</li></ul></li><li><strong>Stress Overload</strong><ul><li>Chidchidapan (<em>irritability</em>), neend na aana, aur har chhoti baat ko bahut bada ya zaroori samajhna</li></ul></li></ul>`,
                translation: "\"Gaon ke bacchon ke paas 'main depressed hoon' kehne ke shabd nahi hote. Unka sharir dard (pet dard, sir dard) ke zariye madad mangta hai.\"",
                soundbite: "\"Jab baccha kehta hai 'mera pet dard kar raha hai', toh kabhi-kabhi yeh uske dimaag ke dard ki awaaz hoti hai.\""
            },
            {
                title: "Slide 5: Four Approaches (Char Asardaar Upay)",
                question: "Garib parivar ke bacchon ki madad kaise ki ja sakti hai?",
                reality: `<ul><li><strong>Play and Art Therapy</strong> (khel aur chitrakala ke zariye ilaaj)<ul><li>Bacche bina shabdon ke apne dard ko vyakt karte hain</li></ul></li><li><strong>Family-Centered Care</strong> (parivar ko shamil karke ilaaj)<ul><li>Jab pura parivar saath deta hai aur ghar ka mahaul sudharta hai, toh baccha jaldi theek hota hai</li></ul></li><li><strong>Peer Support</strong> (sathiyon ka saath)<ul><li>Doston ke sath baat karne ya group activities se akelapan kam hota hai</li></ul></li><li><strong>Tele-mental Health</strong> (phone par salah)<ul><li>Door-daraaz ilaqon mein basic mobile technology (jaise WhatsApp audio) ke zariye madad lena</li></ul></li></ul>`,
                translation: "\"Ilaaj ka matlab sirf dawai nahi hai, balki bacche ki apni bhasha (khel, baat-cheet) mein uski madad karna hai.\"",
                soundbite: "\"Sahi ilaaj wahi hai jo bacche ki duniya aur uski samajh ke hisaab se diya jaye.\""
            },
            {
                title: "Slide 6: Balance Sheet for the Mind (Dimaag ki Seemit Shamta)",
                question: "Bacchon ki mansik shamta (mental capacity) seemit kyun hoti hai?",
                reality: `<ul><li><strong>What Drains It</strong> (kya kamzor karta hai)<ul><li>Lambe samay tak chalne wala tanaav (chronic stress), ku-poshan (malnutrition), aur neend ki kami</li></ul></li><li><strong>What Restores It</strong> (kya theek karta hai)<ul><li>Surakshit neend (protected sleep), parivar ka saath, aur samay par mili sahi dekhbhaal</li></ul></li><li><strong>Blunted Interoception</strong> (sharirik sanketon ko na samajh paana)<ul><li>Tanaav mein jee raha baccha bhookh, pyaas ya thakan ko mehsoos karna band kar deta hai</li></ul></li></ul>`,
                translation: "\"Jaise ek kamzor phone zyada apps nahi chala sakta, waise hi tanaav mein jee raha baccha zyada dabav nahi jhel sakta.\"",
                soundbite: "\"Bacche ki himmat anant ho sakti hai, lekin uske dimaag aur sharir ki shamta seemit (finite) hoti hai.\""
            },
            {
                title: "Slide 7: Coordinated Care (Sahi Dekhbhaal ka Tarika)",
                question: "Mind Grace Neuropsychiatric Clinic ek acchi dekhbhaal (care) kaise provide karta hai?",
                reality: `<ol><li><strong><bdi>Assessment</bdi></strong> (jaanch)<ul><li>Bacche ki neend, khana, aur dar ko bina kisi dar ke samajhna</li></ul></li><li><strong><bdi>Formulation</bdi></strong> (samasya ki jad samajhna)<ul><li>Yeh pata lagana ki kaun si cheez (jaise ghar ka kalesh) is pareshani ko badha rahi hai</li></ul></li><li><strong><bdi>Plan</bdi></strong> (yojna)<ul><li>Parivar aur counselor milkar ek saral aur sasti yojana banate hain</li></ul></li><li><strong><bdi>Review</bdi></strong> (samiksha)<ul><li>Samay-samay par dekhna ki kya baccha behtar mehsoos kar raha hai aur yojana mein badlav karna</li></ul></li></ol>`,
                translation: "\"Hum sirf 'bimar' ka label nahi lagate, hum samajhte hain ki bacche ki pareshani ki jad kahan hai aur use kaise kaata jaye.\"",
                soundbite: "\"Hum sirf lakshan (symptoms) nahi mitate, hum bacche ki puri sthiti ko samajh kar ek behtar raasta dhoondhte hain.\""
            },
            {
                title: "Slide 8: Asking Earlier (Jaldi Madad Mangna)",
                question: "Shuruati lakshanon ko kyun nazarandaaz nahi karna chahiye?",
                reality: `<ul><li><strong>Early Signal</strong> (shuruati sanket)<ul><li>Neend na aana, hamesha dar lagna, ya chhoti chhoti baaton par rona</li></ul></li><li><strong>Clinical Gain</strong> (faayda)<ul><li>Ek assessment (jaanch) yeh bata sakti hai ki yeh sirf ek aaram ki zaroorat hai ya kisi ilaaj ki</li><li>Crisis (sankat) ka intezaar na karein</li></ul></li></ul>`,
                translation: "\"Jaise bukhar aate hi dawai lene se badi bimari rukti hai, waise hi mansik pareshani ko shuru mein hi pakadna zaroori hai.\"",
                soundbite: "\"Bacche ke tootne ka intezaar karna himmat nahi, balki ek galti hai. Shuruat mein hi madad lena hi samajhdari hai.\""
            },
            {
                title: "Slide 9: What Recovery Means (Theek Hona Kya Hai?)",
                question: "Bacche ke liye 'theek hona' (recovery) ka matlab kya hai?",
                reality: `<ul><li><strong>Symptoms</strong> (lakshan kam hona)<ul><li>Dar, udasi, ya baar-baar ek hi baat sochne (rumination) mein kam samay lagna</li></ul></li><li><strong>Function</strong> (rozana ka jeevan)<ul><li>Acchi neend aana, khana khana, aur doston ke sath hasna-khelna</li></ul></li></ul>`,
                translation: "\"Recovery ka matlab sirf school jaana nahi hai. Iska matlab hai ki baccha ab surakshit mehsoos karta hai aur bina dare khel sakta hai.\"",
                soundbite: "\"Asli theek hona tab hai jab baccha bina kisi dar ke khel sake aur apne parivar ke sath khush reh sake.\""
            },
            {
                title: "Slide 10: The People Behind the Care (Madad Karne Wale Log)",
                question: "Is madad mein kaun saath deta hai?",
                reality: `<ul><li><strong>Clinical Leadership</strong><ul><li>Mind Grace Neuropsychiatric Clinic ke Dr. Anita Sharma aur Dr. Sana Firdos</li></ul></li><li><strong>Multidisciplinary Team</strong> (vibhinn visheshagyon ki team)<ul><li>Doctors, counselors, aur parivar ke sadasya milkar ek surakshit net (safety net) banate hain</li></ul></li></ul>`,
                translation: "\"Jab samuday, parivar aur visheshagya (experts) milkar ek disha mein kaam karte hain, tabhi baccha sach mein surakshit mehsoos karta hai.\"",
                soundbite: "\"Bacche ki dekhbhaal ek akela kaam nahi hai; yeh pura parivar aur team milkar karta hai.\""
            },
            {
                title: "Slide 11: Practical Check-in (Do Hafte ki Jaanch)",
                question: "Ghar par hum bacche ki sthiti kaise check kar sakte hain?",
                reality: `<ul><li><strong>Track for Two Weeks</strong> (do hafte tak record karna)<ul><li>Bacche ki neend, mood, gussa, aur khelne ka samay note karein</li></ul></li><li><strong>Look for a Pattern</strong> (pattern dhoondhna)<ul><li>Dekhein ki kya yeh badlav halke dinon mein bhi rehta hai ya rishton par asar dal raha hai</li></ul></li><li><strong>Take the Next Step</strong> (agla kadam)<ul><li>Agar pareshani bani rahe, toh crisis ka intezaar kiye bina professional assessment karwayein</li></ul></li></ul>`,
                translation: "\"Andaze par nahi, saboot par bharosa karein. Do hafte tak dhyan se dekhein ki kya bacche ke vyavahar mein koi badlav hai.\"",
                soundbite: "\"Apni yaadash par nahi, nazron ke saboot par bharosa karein. Do hafte tak dhyan se dekhein, phir faisla karein.\""
            },
            {
                title: "Slide 12: Make the First Appointment Count (Pehla Kadam Sahi Lena)",
                question: "Mind Grace ke sath madad lene ke liye pehla kadam kaise uthayein?",
                reality: `<ul><li><strong>Bring Three Things</strong> (teen cheezein lekar aayein)<ul><li>1) Kya badla hai?&nbsp; 2) Kitne samay se?&nbsp; 3) Aap kya chahte hain?</li></ul></li><li><strong>Ask Directly</strong> (seedhe sawal puchein)<ul><li>Iska karan kya ho sakta hai?</li><li>Mere ilaaj ke vikalp (options) kya hain?</li></ul></li><li><strong>Cognitive Offloading</strong> (dimaag ka bojh kam karna)<ul><li>Aapke paas sab jawab hone zaroori nahi hain, bas data layein</li></ul></li></ul>`,
                translation: "\"Aapke paas sab jawab hone zaroori nahi hain. Bas apne bacche ki sthiti batayein, hum milkar rasta nikalenge.\"",
                soundbite: "\"Aapke paas sab jawab hone zaroori nahi hain. Bas humein wo teen chhoti baatein batayein, aur hum milkar ek behtar yojana banayenge.\""
            }
        ];

        /* ---------------------------------------------------------------- *
         * Presentation controller (IIFE - no globals leak to window).
         * Performance notes:
         *  - Slides are built off-DOM in a DocumentFragment, appended once
         *  - Only two class toggles per navigation (no O(n) loops)
         *  - Progress bar animates via transform:scaleX (compositor-only)
         *  - Touch listeners are passive and scoped to the container;
         *    viewport width is cached and refreshed on resize
         * ---------------------------------------------------------------- */
        (() => {
            'use strict';

            let currentSlide = -1; // forces first goTo() to apply state
            const totalSlides = slidesData.length;

            const presentation      = document.getElementById('presentation');
            const progressBar       = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const slideCounter      = document.getElementById('slideCounter');
            const btnPrev           = document.getElementById('btnPrev');
            const btnNext           = document.getElementById('btnNext');

            /* ---- Render all slides once, then append in a single reflow ---- */
            const fragment = document.createDocumentFragment();
            const slideElements = slidesData.map((slide, index) => {
                const el = document.createElement('section');
                el.className = 'slide';
                el.setAttribute('role', 'group');
                el.setAttribute('aria-roledescription', 'slide');
                el.setAttribute('aria-label', `Slide ${index + 1} of ${totalSlides}`);
                el.innerHTML = `
                    <div class="slide-content">
                        <h1>${slide.title}</h1>
                        <h2>The Question (Sawal)</h2>
                        <p class="question-text">${slide.question}</p>
                        <h2>The Clinical Reality (Chikitsakiya Sachchai)</h2>
                        <div class="reality-card">${slide.reality}</div>
                        <h2>The Translation (Saral Bhasha Mein)</h2>
                        <div class="translation-box">${slide.translation}</div>
                        <h2>The Soundbite (Yaad Rakhne Wali Baat)</h2>
                        <div class="soundbite-box">${slide.soundbite}</div>
                    </div>`;
                fragment.appendChild(el);
                return el;
            });
            presentation.appendChild(fragment);

            /* ---- State update (single write path) ---- */
            let activeEl = null;

            function goTo(index) {
                if (index === currentSlide) return;
                if (index < 0 || index >= totalSlides) return;

                if (activeEl) {
                    activeEl.classList.remove('active');
                    activeEl.inert = true;   // remove hidden slides from tab order
                }

                currentSlide = index;
                activeEl = slideElements[index];
                activeEl.classList.add('active');
                activeEl.inert = false;
                activeEl.scrollTop = 0;      // reset scroll position on new slide

                const fraction = (currentSlide + 1) / totalSlides;
                progressBar.style.transform = `scaleX(${fraction})`;
                progressContainer.setAttribute('aria-valuenow', String(Math.round(fraction * 100)));
                slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;

                btnPrev.disabled = currentSlide === 0;
                btnNext.disabled = currentSlide === totalSlides - 1;
            }

            const nextSlide = () => goTo(currentSlide + 1);
            const prevSlide = () => goTo(currentSlide - 1);

            /* ---- Buttons ---- */
            btnNext.addEventListener('click', nextSlide);
            btnPrev.addEventListener('click', prevSlide);

            /* ---- Keyboard ---- */
            document.addEventListener('keydown', (e) => {
                // Let Space/Enter activate a focused button natively
                if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
                switch (e.key) {
                    case 'ArrowRight':
                    case ' ':
                        e.preventDefault();
                        nextSlide();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        prevSlide();
                        break;
                    case 'Home':
                        e.preventDefault();
                        goTo(0);
                        break;
                    case 'End':
                        e.preventDefault();
                        goTo(totalSlides - 1);
                        break;
                }
            });

            /* ---- Unified pointer gestures (touch + mouse) ----
             *  - Swipe left / drag left  -> next slide
             *  - Swipe right / drag right -> previous slide
             *  - Tap / click right half  -> next;  left half -> previous
             *  - Vertical scrolling inside a slide is never hijacked:
             *    if the slide is scrollable and not at the boundary in the
             *    swipe direction, the gesture is ignored (no rubber-band
             *    page turns while reading).
             *  - Edge exclusion zone prevents clashing with system
             *    back-gestures on mobile.
             * Uses Pointer Events so one code path covers touch, pen and
             * mouse (drag-to-navigate works on desktop too). Listeners are
             * registered only when Pointer Events are supported; otherwise
             * keyboard/buttons remain fully functional.
             */
            const SWIPE_THRESHOLD = 40;   // px of horizontal travel to count as a swipe
            const TAP_SLOP        = 15;   // max movement (px) still considered a tap/click
            const TAP_DURATION    = 350;  // ms
            const EDGE_ZONE       = 24;   // px from screen edges ignored (system gestures)

            let viewportW = window.innerWidth;
            window.addEventListener('resize', () => {
                viewportW = window.innerWidth;
            }, { passive: true });

            /* Track input modality so hover affordances / click zones only
               apply to mouse users (prevents sticky hover on touch devices). */
            const mediaHover = window.matchMedia('(hover: hover) and (pointer: fine)');
            function setModality(isMouse) {
                document.body.classList.toggle('has-mouse', isMouse);
            }
            if (typeof mediaHover.addEventListener === 'function') {
                mediaHover.addEventListener('change', (e) => setModality(e.matches));
            }
            setModality(mediaHover.matches);

            /* Allow page-turn swipes only when the user isn't clearly
               mid-vertical-scroll inside a slide (reading mode). */
            function atScrollBoundary(el) {
                if (!el) return true;
                const scrollable = el.scrollHeight - el.clientHeight > 2;
                if (!scrollable) return true;
                const atTop = el.scrollTop <= 0;
                const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
                return atTop || atBottom;
            }

            if ('PointerEvent' in window) {
                let pid = null;           // active pointerId (single-pointer tracking)
                let startX = 0, startY = 0, startT = 0;
                let axis = null;          // 'x' once horizontal intent is clear

                const withinEdgeZone = (x) => x < EDGE_ZONE || x > viewportW - EDGE_ZONE;

                presentation.addEventListener('pointerdown', (e) => {
                    if (pid !== null) return;                 // ignore multi-touch extras
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    pid = e.pointerId;
                    startX = e.clientX;
                    startY = e.clientY;
                    startT = performance.now();
                    axis = null;
                }, { passive: true });

                presentation.addEventListener('pointermove', (e) => {
                    if (e.pointerId !== pid) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    // Once the pointer clearly travels horizontally, capture it
                    // so the browser stops treating it as a vertical pan/select.
                    if (axis === null && Math.abs(dx) > TAP_SLOP && Math.abs(dx) > Math.abs(dy)) {
                        axis = 'x';
                        try { presentation.setPointerCapture(pid); } catch (_) {}
                    }
                }, { passive: true });

                function endGesture(e) {
                    if (e.pointerId !== pid) return;
                    const id = pid;
                    pid = null;
                    try { presentation.releasePointerCapture(id); } catch (_) {}

                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    const absX = Math.abs(dx);
                    const absY = Math.abs(dy);
                    const elapsed = performance.now() - startT;

                    // A horizontal gesture is only accepted when the pointer
                    // was captured mid-move (axis === 'x'). This prevents a
                    // diagonal scroll that happens to end with a large X
                    // delta from accidentally turning the page.
                    if (axis === 'x' && absX > SWIPE_THRESHOLD) {
                        // Horizontal swipe/drag: left -> next, right -> previous.
                        // Skip while vertically mid-scroll inside a slide.
                        if (atScrollBoundary(activeEl)) {
                            if (dx < 0) nextSlide(); else prevSlide();
                        }
                    } else if (axis === null &&
                               absX < TAP_SLOP && absY < TAP_SLOP && elapsed < TAP_DURATION) {
                        // Tap / click: right half -> next, left half -> previous.
                        // Ignore taps that started in the system edge zone and
                        // taps on interactive controls (buttons already handle them).
                        const target = e.target;
                        const onControl = target instanceof Element &&
                                          target.closest('.controls, button, a');
                        if (!onControl && !withinEdgeZone(startX)) {
                            if (startX > viewportW / 2) nextSlide(); else prevSlide();
                        }
                    }
                }

                presentation.addEventListener('pointerup', endGesture, { passive: true });
                presentation.addEventListener('pointercancel', (e) => {
                    if (e.pointerId === pid) pid = null;
                }, { passive: true });

                /* Suppress the synthetic mouse click that follows a touch tap,
                   so nav-zone click handlers only ever fire for real mouse
                   users (prevents double-advance on touch devices). */
                let suppressClickUntil = 0;
                presentation.addEventListener('touchend', () => {
                    suppressClickUntil = performance.now() + 700;
                }, { passive: true });
                const isPhantomClick = () => performance.now() < suppressClickUntil;
                document.getElementById('navLeft').addEventListener('click', (e) => {
                    if (!isPhantomClick()) prevSlide();
                });
                document.getElementById('navRight').addEventListener('click', (e) => {
                    if (!isPhantomClick()) nextSlide();
                });
            } else {
                /* Legacy fallback (no Pointer Events): simple touch swipe/tap */
                let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
                presentation.addEventListener('touchstart', (e) => {
                    const t = e.changedTouches[0];
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    touchStartTime = Date.now();
                }, { passive: true });
                presentation.addEventListener('touchend', (e) => {
                    const t = e.changedTouches[0];
                    const diffX = t.clientX - touchStartX;
                    const diffY = t.clientY - touchStartY;
                    const absX = Math.abs(diffX);
                    const absY = Math.abs(diffY);
                    if (absX > SWIPE_THRESHOLD && absX > absY) {
                        if (diffX < 0) nextSlide(); else prevSlide();
                    } else if (absX < TAP_SLOP && absY < TAP_SLOP &&
                               (Date.now() - touchStartTime) < TAP_DURATION) {
                        if (t.clientX > viewportW / 2) nextSlide(); else prevSlide();
                    }
                }, { passive: true });

                /* ---- Desktop click zones (left/right halves of the screen) ---- */
                document.getElementById('navLeft').addEventListener('click', prevSlide);
                document.getElementById('navRight').addEventListener('click', nextSlide);
            }

            /* ---- Initialize ---- */
            goTo(0);
        })();
    </script>
</body>
</html>
